<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2f3a4a"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .section-title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .task { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 12; }
      .gateway { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .event { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .end { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .label { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .small { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .flow { stroke: #2f3a4a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .flow-dashed { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .note { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #4b5563; }
    </style>
  </defs>

  <!-- Título -->
  <text x="900" y="52" text-anchor="middle" class="title">MAPA Backend - Fluxos BPMN</text>

  <!-- Processo 1: Cadastro -->
  <rect x="40" y="110" width="820" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="142" class="section-title">1. Cadastro de Usuário</text>

  <rect x="90" y="170" width="130" height="60" rx="12" class="event"/>
  <text x="155" y="205" text-anchor="middle" class="label">Início</text>
  <text x="155" y="220" text-anchor="middle" class="small">Solicitação</text>

  <line x1="220" y1="200" x2="270" y2="200" class="flow"/>

  <rect x="270" y="170" width="150" height="60" rx="12" class="task"/>
  <text x="345" y="198" text-anchor="middle" class="label">Validar</text>
  <text x="345" y="214" text-anchor="middle" class="small">dados</text>

  <line x1="420" y1="200" x2="475" y2="200" class="flow"/>

  <polygon points="475,170 545,200 475,230 405,200" class="gateway"/>
  <text x="475" y="196" text-anchor="middle" class="small">Dados</text>
  <text x="475" y="212" text-anchor="middle" class="small">válidos?</text>

  <line x1="545" y1="200" x2="610" y2="200" class="flow"/>

  <rect x="610" y="170" width="150" height="60" rx="12" class="task"/>
  <text x="685" y="198" text-anchor="middle" class="label">Verificar</text>
  <text x="685" y="214" text-anchor="middle" class="small">e-mail</text>

  <line x1="685" y1="230" x2="685" y2="270" class="flow"/>

  <polygon points="685,270 750,310 685,350 620,310" class="gateway"/>
  <text x="685" y="306" text-anchor="middle" class="small">E-mail</text>
  <text x="685" y="322" text-anchor="middle" class="small">cadastrado?</text>

  <line x1="620" y1="310" x2="570" y2="310" class="flow"/>
  <text x="600" y="300" text-anchor="middle" class="note">Não</text>

  <rect x="390" y="290" width="170" height="60" rx="12" class="task"/>
  <text x="475" y="319" text-anchor="middle" class="label">Validar</text>
  <text x="475" y="335" text-anchor="middle" class="small">perfil/termos</text>

  <line x1="475" y1="350" x2="475" y2="390" class="flow"/>

  <rect x="380" y="390" width="190" height="60" rx="12" class="task"/>
  <text x="475" y="419" text-anchor="middle" class="label">Codificar senha</text>
  <text x="475" y="435" text-anchor="middle" class="small">e criar usuário</text>

  <line x1="475" y1="450" x2="475" y2="490" class="flow"/>

  <rect x="410" y="490" width="130" height="60" rx="12" class="task"/>
  <text x="475" y="520" text-anchor="middle" class="label">Auditar</text>
  <text x="475" y="536" text-anchor="middle" class="small">evento</text>

  <line x1="475" y1="550" x2="475" y2="585" class="flow"/>

  <rect x="420" y="585" width="110" height="55" rx="12" class="end"/>
  <text x="475" y="618" text-anchor="middle" class="label">Sucesso</text>

  <line x1="475" y1="200" x2="475" y2="170" class="flow-dashed"/>
  <text x="492" y="158" text-anchor="middle" class="note">Não</text>
  <line x1="750" y1="310" x2="780" y2="310" class="flow-dashed"/>
  <line x1="780" y1="310" x2="780" y2="610" class="flow-dashed"/>
  <line x1="780" y1="610" x2="530" y2="610" class="flow-dashed"/>
  <text x="766" y="280" text-anchor="middle" class="note">Sim</text>

  <!-- Processo 2: Login -->
  <rect x="900" y="110" width="860" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="920" y="142" class="section-title">2. Login do Usuário</text>

  <rect x="955" y="170" width="130" height="60" rx="12" class="event"/>
  <text x="1020" y="205" text-anchor="middle" class="label">Início</text>
  <text x="1020" y="220" text-anchor="middle" class="small">Login</text>

  <line x1="1085" y1="200" x2="1135" y2="200" class="flow"/>

  <rect x="1135" y="170" width="145" height="60" rx="12" class="task"/>
  <text x="1207" y="198" text-anchor="middle" class="label">Validar</text>
  <text x="1207" y="214" text-anchor="middle" class="small">e-mail/senha</text>

  <line x1="1280" y1="200" x2="1335" y2="200" class="flow"/>

  <polygon points="1335,170 1405,200 1335,230 1265,200" class="gateway"/>
  <text x="1335" y="195" text-anchor="middle" class="small">Dados</text>
  <text x="1335" y="212" text-anchor="middle" class="small">válidos?</text>

  <line x1="1405" y1="200" x2="1470" y2="200" class="flow"/>

  <rect x="1470" y="170" width="145" height="60" rx="12" class="task"/>
  <text x="1542" y="198" text-anchor="middle" class="label">Buscar</text>
  <text x="1542" y="214" text-anchor="middle" class="small">usuário</text>

  <line x1="1542" y1="230" x2="1542" y2="275" class="flow"/>

  <polygon points="1542,275 1608,310 1542,345 1476,310" class="gateway"/>
  <text x="1542" y="306" text-anchor="middle" class="small">Usuário</text>
  <text x="1542" y="322" text-anchor="middle" class="small">ativo?</text>

  <line x1="1476" y1="310" x2="1410" y2="310" class="flow"/>
  <rect x="1210" y="285" width="190" height="60" rx="12" class="task"/>
  <text x="1305" y="314" text-anchor="middle" class="label">Verificar senha</text>
  <text x="1305" y="330" text-anchor="middle" class="small">e gerar JWT</text>

  <line x1="1305" y1="345" x2="1305" y2="385" class="flow"/>

  <rect x="1270" y="385" width="130" height="60" rx="12" class="end"/>
  <text x="1335" y="420" text-anchor="middle" class="label">Sucesso</text>

  <line x1="1335" y1="200" x2="1335" y2="170" class="flow-dashed"/>
  <text x="1351" y="158" text-anchor="middle" class="note">Não</text>
  <line x1="1608" y1="310" x2="1670" y2="310" class="flow-dashed"/>
  <line x1="1670" y1="310" x2="1670" y2="610" class="flow-dashed"/>
  <line x1="1670" y1="610" x2="1335" y2="610" class="flow-dashed"/>
  <text x="1625" y="280" text-anchor="middle" class="note">Não</text>

  <!-- Processo 3: Recuperação senha -->
  <rect x="40" y="500" width="820" height="400" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="532" class="section-title">3. Recuperação de Senha</text>

  <rect x="95" y="560" width="130" height="60" rx="12" class="event"/>
  <text x="160" y="595" text-anchor="middle" class="label">Início</text>
  <text x="160" y="610" text-anchor="middle" class="small">Pedido</text>

  <line x1="225" y1="590" x2="275" y2="590" class="flow"/>

  <rect x="275" y="560" width="150" height="60" rx="12" class="task"/>
  <text x="350" y="588" text-anchor="middle" class="label">Validar</text>
  <text x="350" y="604" text-anchor="middle" class="small">e-mail</text>

  <line x1="425" y1="590" x2="475" y2="590" class="flow"/>

  <polygon points="475,560 545,590 475,620 405,590" class="gateway"/>
  <text x="475" y="585" text-anchor="middle" class="small">E-mail</text>
  <text x="475" y="601" text-anchor="middle" class="small">válido?</text>

  <line x1="545" y1="590" x2="610" y2="590" class="flow"/>

  <rect x="610" y="560" width="160" height="60" rx="12" class="task"/>
  <text x="690" y="588" text-anchor="middle" class="label">Buscar</text>
  <text x="690" y="604" text-anchor="middle" class="small">usuário</text>

  <line x1="690" y1="620" x2="690" y2="665" class="flow"/>

  <polygon points="690,665 758,700 690,735 622,700" class="gateway"/>
  <text x="690" y="696" text-anchor="middle" class="small">Usuário</text>
  <text x="690" y="712" text-anchor="middle" class="small">achado?</text>

  <line x1="622" y1="700" x2="575" y2="700" class="flow"/>
  <text x="608" y="687" text-anchor="middle" class="note">Não</text>

  <rect x="405" y="670" width="170" height="60" rx="12" class="task"/>
  <text x="490" y="698" text-anchor="middle" class="label">Gerar</text>
  <text x="490" y="714" text-anchor="middle" class="small">token/reset</text>

  <line x1="490" y1="730" x2="490" y2="775" class="flow"/>

  <rect x="425" y="775" width="130" height="60" rx="12" class="task"/>
  <text x="490" y="803" text-anchor="middle" class="label">Enviar</text>
  <text x="490" y="819" text-anchor="middle" class="small">e-mail</text>

  <line x1="490" y1="835" x2="490" y2="870" class="flow"/>

  <rect x="440" y="870" width="100" height="48" rx="12" class="end"/>
  <text x="490" y="900" text-anchor="middle" class="label">Sucesso</text>

  <line x1="475" y1="590" x2="475" y2="560" class="flow-dashed"/>
  <text x="491" y="548" text-anchor="middle" class="note">Não</text>
  <line x1="758" y1="700" x2="820" y2="700" class="flow-dashed"/>
  <line x1="820" y1="700" x2="820" y2="913" class="flow-dashed"/>
  <line x1="820" y1="913" x2="540" y2="913" class="flow-dashed"/>
  <text x="780" y="685" text-anchor="middle" class="note">Sim</text>

  <!-- Processo 4: Redefinição de senha -->
  <rect x="900" y="500" width="860" height="400" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="920" y="532" class="section-title">4. Redefinição de Senha</text>

  <rect x="955" y="560" width="130" height="60" rx="12" class="event"/>
  <text x="1020" y="595" text-anchor="middle" class="label">Início</text>
  <text x="1020" y="610" text-anchor="middle" class="small">Link</text>

  <line x1="1085" y1="590" x2="1135" y2="590" class="flow"/>

  <rect x="1135" y="560" width="160" height="60" rx="12" class="task"/>
  <text x="1215" y="588" text-anchor="middle" class="label">Validar</text>
  <text x="1215" y="604" text-anchor="middle" class="small">token</text>

  <line x1="1295" y1="590" x2="1350" y2="590" class="flow"/>

  <polygon points="1350,560 1420,590 1350,620 1280,590" class="gateway"/>
  <text x="1350" y="585" text-anchor="middle" class="small">Token</text>
  <text x="1350" y="602" text-anchor="middle" class="small">válido?</text>

  <line x1="1420" y1="590" x2="1485" y2="590" class="flow"/>

  <rect x="1485" y="560" width="170" height="60" rx="12" class="task"/>
  <text x="1570" y="588" text-anchor="middle" class="label">Validar</text>
  <text x="1570" y="604" text-anchor="middle" class="small">nova senha</text>

  <line x1="1570" y1="620" x2="1570" y2="670" class="flow"/>

  <polygon points="1570,670 1638,705 1570,740 1502,705" class="gateway"/>
  <text x="1570" y="701" text-anchor="middle" class="small">Senha</text>
  <text x="1570" y="717" text-anchor="middle" class="small">válida?</text>

  <line x1="1502" y1="705" x2="1448" y2="705" class="flow"/>
  <text x="1530" y="690" text-anchor="middle" class="note">Não</text>

  <rect x="1240" y="675" width="180" height="60" rx="12" class="task"/>
  <text x="1330" y="703" text-anchor="middle" class="label">Salvar</text>
  <text x="1330" y="719" text-anchor="middle" class="small">nova senha</text>

  <line x1="1330" y1="735" x2="1330" y2="780" class="flow"/>

  <rect x="1245" y="780" width="170" height="60" rx="12" class="task"/>
  <text x="1330" y="808" text-anchor="middle" class="label">Invalidar</text>
  <text x="1330" y="824" text-anchor="middle" class="small">token</text>

  <line x1="1330" y1="840" x2="1330" y2="875" class="flow"/>

  <rect x="1268" y="875" width="125" height="50" rx="12" class="end"/>
  <text x="1330" y="907" text-anchor="middle" class="label">Sucesso</text>

  <line x1="1350" y1="590" x2="1350" y2="560" class="flow-dashed"/>
  <text x="1366" y="548" text-anchor="middle" class="note">Não</text>
  <line x1="1638" y1="705" x2="1695" y2="705" class="flow-dashed"/>
  <line x1="1695" y1="705" x2="1695" y2="910" class="flow-dashed"/>
  <line x1="1695" y1="910" x2="1395" y2="910" class="flow-dashed"/>
  <text x="1656" y="690" text-anchor="middle" class="note">Sim</text>
</svg>
