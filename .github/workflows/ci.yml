name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes_unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Executar testes unitários
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test

  testes_integration:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Executar testes de integração
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon integrationTest

  linter:
    name: Linter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Executar Checkstyle
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon checkstyleMain checkstyleTest
