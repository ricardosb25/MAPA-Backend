spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# ddl-auto usa "update" (e não "create-drop") de propósito: o H2 em memória é compartilhado por vários
# contextos de teste e classes com @DirtiesContext fecham contextos no meio da suíte. Com "create-drop",
# esse shutdown (e boots de novos contextos) executaria DROP SCHEMA derrubando as tabelas de outros
# contextos ainda ativos. O banco nasce vazio a cada JVM, então "update" já cria tudo no primeiro boot.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
jwt.secret=test-secret-with-more-than-32-characters-123456
jwt.expiration-ms=3600000
admin.email=admin@mapa.test
admin.password=AdminTest12345!
